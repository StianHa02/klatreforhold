# Helleneset (felt_id 5), Bergen
# Kilde: BKK nettfører (felt-tabellen): orientering 270, bratthet 1 (sva), sol fra 12:00 (nettføreren),
# regnsikkert = false. Beskrivelse: "Noen av rutene tørker raskt etter regnvær."
crag:
  name: Helleneset
  felt_id: 5
  lat: 60.4343
  lon: 5.2806
  elevation_m: 3        # bakkehøyde fra DOM1
  timezone: Europe/Oslo
  face_azimuth_deg: 270
  face_tilt_deg: 70       # sva: anslått helning, juster ved behov
  # Horisont sett fra veggfoten (asimut, høyde i grader), beregnet fra Kartverket DOM1 (med trær)
  # med scripts/horizon_from_dem.py --step-deg 5 (ignorerer nærmeste 10 m). 90 = bak veggen.
