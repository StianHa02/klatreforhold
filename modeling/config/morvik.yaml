# Morvik (felt_id 36), Åsane, Bergen
# Kilde: BKK nettfører (felt-tabellen, eksport 2026-11-05): orientering 180, bratthet 1 (sva),
# regnsikkert = false. Retning korrigert av eier til 170 etter soltidskontroll.
crag:
  name: Morvik
  felt_id: 36
  lat: 60.473946
  lon: 5.279594
  elevation_m: 172.14     # Kartverket DTM i nettførerpunktet; hele lia er svaet (jevnt 50–60° fall 20 m bak til 20 m foran), kontrollert 2026-11-05
  geology: ukjent        # ikke kontrollert mot NGU ennå
  geometry_source: https://ute.bergenklatreklubb.no/felt/morvik
  geometry_checked: '2026-11-05'
  timezone: Europe/Oslo
  frost_station: SN50540  # Bergen - Florida (krever FROST_CLIENT_ID); Åsane (Bergen kommune) 3.4 km er alternativ
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 170   # eier 2026-11-05 (nettføreren sa 180). Sol oppgitt fra 13:00; modellen gir sol fra morgenen, så noe skjermer trolig i øst
  face_tilt_deg: 70      # sva: anslått helning, juster ved behov
  steepness_id: 1        # BKK-kategori; styrer også foreløpig regnskjerming
  # Horisont sett fra veggfoten (asimut, høyde i grader), beregnet fra Kartverket DOM1 (med trær)
