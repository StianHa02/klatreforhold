# Sandviken (felt_id 33), Bergen
# Kilde: BKK nettfører (felt-tabellen): orientering 270, bratthet 2 (vertikalt), sol fra 12:00 (nettføreren),
# regnsikkert = false. Beskrivelse: "Feltet tørker raskt etter regnvær."
crag:
  name: Sandviken
  felt_id: 33
  lat: 60.4166
  lon: 5.3190
  elevation_m: 78        # bakkehøyde fra DOM1
  timezone: Europe/Oslo
  frost_station: SN50540  # Bergen - Florida (krever FROST_CLIENT_ID)
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 270
  face_tilt_deg: 90
  # Horisont sett fra veggfoten (asimut, høyde i grader), beregnet fra Kartverket DOM1 (med trær)
  # med scripts/horizon_from_dem.py --step-deg 5 (ignorerer nærmeste 10 m). 90 = bak veggen.
