# Parametre i den fysiske modellen. Startverdier fra litteraturen (se docs/RESEARCH.md),
# skal kalibreres når vi har ekte tørt/vått-observasjoner.
model:
  # Regn som treffer veggen
  wdr_coefficient: 0.12         # slagregn på vegg. 0.188 er målt i fritt felt i Bergen (øvre referanse); vegger 0.02-0.26. Kalibreres først
  wdr_exponent: 0.88            # R_vegg = alfa * U * R_h^0.88 * cos(D - theta) (Blocken & Carmeliet 2004)
  wind_exposure: 0.4  # foreløpig lokalt anslag (innlandsdal, skogkledd), ikke kalibrert
  direct_rain_fraction: 0.10    # andel av horisontal nedbør som treffer tak/hyller uansett vind
  runoff_from_above: 0.05       # vann som renner ned fra toppen (andel av horisontal nedbør)
  # Vannlagre (mm)
  film_capacity_mm: 0.1         # vertikal flate holder ~0.08 mm før det renner av
  # Klatrefelt har generelt få hyller/sprekker som samler vann: standard 0.3 / 1.0 fra 31.10.2026 (var 0.6 / 0.5),
  # etter fem tørt-observasjoner på Bymuren og følsomhetsanalyse (scripts/sensitivity.py). Ikke kalibrert mot våt-observasjoner.
  holds_capacity_mm: 0.3        # vann i sprekker/tak/hyller (tørker saktere). Gneis/granitt: porøsitet ~0.5 %, så nesten alt vann ligger på overflaten og i sprekker
  film_to_holds_rate: 0.3       # andel av filmen som renner inn i tak/sprekker per time
  holds_drying_factor: 1.0      # tak/sprekker tørker med denne andelen av potensiell fordampning
  # Siging (sakte reservoar matet av nedbør over feltet)
  seep_enabled: true
  seep_catchment_factor: 0.02   # andel av nedbøren som havner i reservoaret
  seep_timescale_h: 120         # tømmetid for reservoaret (forsinket nedbørsindeks, 4-8 døgn)
  seep_threshold_mm: 0.3        # reservoar over dette gir siging på veggen. 0.5 -> 0.3 1.11.2026: 13 observasjoner på fire felt, 11 treff mot 10
  # Energibalanse for bergoverflaten
  albedo: 0.30                  # gneis/granitt ~0.2-0.35
  emissivity: 0.92              # stein 0.86-0.95
  surface_layer_m: 0.05         # tykkelse på "aktivt" berglag
  rock_heat_capacity: 2.2e6     # J/m3/K
  rock_conductivity: 2.5        # W/m/K
  conduction_depth_m: 0.25      # avstand til "dyp" bergnode
  deep_temp_timescale_h: 120    # dyp bergtemperatur = eksponentielt glidende snitt av lufttemp
  sky_view_factor: 0.1450  # kontrollverdi; beregnes fra horisont og helning
  # Terskler for status
  wet_threshold_mm: 0.05        # film eller tak over dette = vått
  damp_threshold_mm: 0.01
