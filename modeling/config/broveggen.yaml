# regnsikkert = false.
crag:
  name: Broveggen
  felt_id: 111
  lat: 60.372803
  lon: 5.170732
  elevation_m: 6.96     # Kartverket DTM i nettførerpunktet, kontrollert 2026-11-05; veggen bak, sjøen 10 m foran
  geology: ukjent        # ikke kontrollert mot NGU ennå
  geometry_source: https://ute.bergenklatreklubb.no/felt/broveggen
  geometry_checked: '2026-11-05'
  timezone: Europe/Oslo
  frost_station: SN50540  # Bergen - Florida (krever FROST_CLIENT_ID); nærmeste er vegstasjoner ved Sotrabrua
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 270   # nettfører
  face_tilt_deg: 100      # overhengende (bratthet_id 3): anslått helning, juster ved behov
  steepness_id: 3        # BKK-kategori; styrer også foreløpig regnskjerming
