# Fergeveggen (felt_id 90), Krokeide, Bergen sør
# Kilde: BKK nettfører (felt-tabellen, eksport 2026-11-05): orientering 68, bratthet 2 (vertikalt),
# regnsikkert = false.
crag:
  name: Fergeveggen
  felt_id: 90
  lat: 60.222
  lon: 5.291001
  elevation_m: 3.6     # DTM 10 m bak nettførerpunktet (punktet 1.9 m ligger ~13 m ut mot sjøen; veggen stiger 18 m mellom 30 og 12 m bak), kontrollert 2026-11-05. Horisont med --offset-m=-10
  geology: ukjent        # ikke kontrollert mot NGU ennå
  geometry_source: https://ute.bergenklatreklubb.no/felt/fergeveggen
  geometry_checked: '2026-11-05'
  timezone: Europe/Oslo
  frost_station: SN50450  # Fana - Stend, 6 km (krever FROST_CLIENT_ID)
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 68   # nettfører
  face_tilt_deg: 90      # vertikalt (bratthet_id 2)
  steepness_id: 2        # BKK-kategori; styrer også foreløpig regnskjerming
