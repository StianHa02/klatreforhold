# Syltøy (felt_id 3), Øygarden vest
# Kilde: BKK nettfører (felt-tabellen, eksport 2026-11-05): orientering 270, bratthet 3 (overhengende),
# regnsikkert = false.
crag:
  name: Syltøy
  felt_id: 3
  lat: 60.333668
  lon: 4.977402
  elevation_m: 1.0     # fjæra ved veggfoten (anslag): nettførerpunktet ligger i sjøen, foten ~6 m bak punktet (DTM 1.45 m), kontrollert 2026-11-05. Horisont med --offset-m=-3
  geology: ukjent        # ikke kontrollert mot NGU ennå
  geometry_source: https://ute.bergenklatreklubb.no/felt/syltoey
  geometry_checked: '2026-11-05'
  timezone: Europe/Oslo
  frost_station: SN50540  # Bergen - Florida (krever FROST_CLIENT_ID); bare kontroll, ~20 km unna; nærmeste er vegstasjon FV560 Krossleitet 5.7 km
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 270   # nettfører
  face_tilt_deg: 100      # overhengende (bratthet_id 3): anslått helning, juster ved behov
  steepness_id: 3        # BKK-kategori; styrer også foreløpig regnskjerming
  # Horisont sett fra veggfoten (asimut, høyde i grader), beregnet fra Kartverket DOM1 (med trær)
