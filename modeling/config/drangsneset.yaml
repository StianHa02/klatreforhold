# Drangsneset (felt_id 112), Fanafjorden, Bergen sør
# Kilde: BKK nettfører (felt-tabellen, eksport 2026-11-05): orientering 270, bratthet 2 (vertikalt),
# regnsikkert = false. Retning korrigert av eier til 45 (uverifisert) etter soltidskontroll.
crag:
  name: Drangsneset
  felt_id: 112
  lat: 60.207115
  lon: 5.352097
  elevation_m: 6.4     # Kartverket DTM i nettførerpunktet, kontrollert 2026-11-05. NB: DTM viser ingen vegg langs 270°; terrenget stiger svakt mot vest. Geometri bør sjekkes i felt
  geology: ukjent        # ikke kontrollert mot NGU ennå
  geometry_source: https://ute.bergenklatreklubb.no/felt/drangsneset
  geometry_checked: '2026-11-05'
  timezone: Europe/Oslo
  frost_station: SN50450  # Fana - Stend, 7.4 km (krever FROST_CLIENT_ID)
  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 45    # eier 2026-11-05, ikke verifisert (nettføreren sa 270). DTM langs 45°: jevn stigning 16 m over 40 m bak punktet, ingen tydelig vegg
  face_tilt_deg: 90      # vertikalt (bratthet_id 2)
  steepness_id: 2        # BKK-kategori; styrer også foreløpig regnskjerming
  # Horisont sett fra veggfoten (asimut, høyde i grader), beregnet fra Kartverket DOM1 (med trær)
