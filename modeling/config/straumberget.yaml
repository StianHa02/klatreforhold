  frost_bruk: kontroll     # brukes til å sjekke varselet; "erstatt" bare for stasjoner 1-2 km unna
  face_azimuth_deg: 225   # eier 2026-11-05 (nettføreren sa 270; sol fra 12:00 passer ikke en rein vestvegg). DTM: vegg 46→20 m rett bak punktet
  face_tilt_deg: 90      # vertikalt (bratthet_id 2)
