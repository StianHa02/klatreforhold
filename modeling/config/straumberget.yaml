# regnsikkert = false. Retning korrigert av eier til 225 etter soltidskontroll.
crag:
  name: Straumberget
  felt_id: 73
  omraade: Askøy/Lillesotra   # nettførerens område, brukes til gruppering på nettsiden
  lat: 60.395164
  lon: 5.164371
