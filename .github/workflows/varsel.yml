name: Oppdater varsel

# Kjører modellen hver time og skriver resultatet til Supabase.
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, KLATREFORHOLD_CONTACT, FROST_CLIENT_ID (valgfri: målt historikk)
on:
  schedule:
    - cron: '7 * * * *'   # hvert time, 7 min over (GitHub kan forsinke eller hoppe over kjøringer)
  workflow_dispatch: {}   # også startbar for hånd, eller fra Supabase Cron (supabase/valgfritt/)

concurrency:
  group: varsel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modeling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: modeling/data/cache
          key: weather-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-v2-
      - name: Kjør modell og lagre i Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KLATREFORHOLD_CONTACT: ${{ secrets.KLATREFORHOLD_CONTACT }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
        run: python scripts/publish_forecast.py
