name: Test nettsiden

# Kjører testene og typesjekken for web/ på pull requests og på main.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/test-web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/test-web.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
